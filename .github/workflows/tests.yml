name: tests

# Runs on every push and every pull request. The point is that a contributor
# sees a red mark before a reviewer has to read the diff, and that nobody can
# merge a change that breaks an import or an energy balance.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run still in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # One Windows and one macOS job, to catch the two problems that only
          # appear off Linux: case-insensitive filename collisions, and paths
          # that exceed the Windows limit.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the library and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the test suite
        # MPLBACKEND is belt and braces: conftest.py sets Agg as well, but a
        # module that imports pyplot before conftest runs would otherwise try
        # to open a window on a machine that has no display.
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest -v --junitxml=junit.xml

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the library and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Measure coverage
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest --cov=labothappy --cov-report=xml --cov-report=term

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
